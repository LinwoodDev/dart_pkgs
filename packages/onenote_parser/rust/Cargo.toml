[package]
name = "rust_lib_onenote_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.6"
onenote_parser = { version = "2.0.0", default-features = false, features = ["onepkg"] }
typed-path = "0.12.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
onenote_parser = { version = "2.0.0", default-features = false, features = ["native-fs", "onepkg"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
