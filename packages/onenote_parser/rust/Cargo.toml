[package]
name = "rust_lib_onenote_parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_lib_onenote_parser"
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
onenote_parser = { version = "2.0.0", default-features = false, features = ["onepkg"] }
typed-path = "0.12.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = "thin"
codegen-units = 1
